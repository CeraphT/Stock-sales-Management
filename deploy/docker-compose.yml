# StockFlow / PharmaStock production stack — one Hetzner box.
#   api.mfspace.lu   → api (.NET) ── Postgres
#   stock.mfspace.lu → web (Vite static)
#   budget.mfspace.lu → HouseBudget (added in Phase B)
# Caddy fronts everything with automatic Let's Encrypt TLS.
#
# Run from this folder:  docker compose up -d --build
# Build context is the repo root (..) so the Dockerfiles can see all projects.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pharmastock
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d pharmastock"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: src/PharmaStock.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Database=pharmastock;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      SuperAdmin__BootstrapSecret: ${BOOTSTRAP_SECRET}
      # Browser-origin allow-list. Web client + the Tauri desktop webview
      # (Windows uses http://tauri.localhost). Native mobile (RN) isn't subject
      # to CORS. Adjust if the desktop reports a different origin.
      CORS_ORIGINS: "https://stock.mfspace.lu,http://tauri.localhost,https://tauri.localhost"
      AUTO_MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: "https://api.mfspace.lu"
    restart: unless-stopped

  # HouseBudget v2 — the rebuilt rental-management app (separate repo
  # CeraphT/HouseBudget-v2). Clone it as a sibling of this repo on the server, or
  # set HB_REPO_PATH in .env. Reuses this stack's Postgres (own "housebudget" DB,
  # auto-created + migrated on start) and Caddy. Replaces the old Blazor app.
  hbapi:
    build:
      context: ${HB_REPO_PATH:-../../HouseBudget-v2}
      dockerfile: src/HouseBudget.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Database=housebudget;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${HB_JWT_SECRET}
      CORS_ORIGINS: "https://budget.mfspace.lu,http://tauri.localhost,https://tauri.localhost"
      AUTO_MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  hbweb:
    build:
      context: ${HB_REPO_PATH:-../../HouseBudget-v2}
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: "https://budgetapi.mfspace.lu"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - hbapi
      - hbweb
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
