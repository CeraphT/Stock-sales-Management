[package]
name = "pharmastock-desktop"
version = "0.1.0"
description = "PharmaStock desktop client"
authors = ["PharmaStock"]
edition = "2021"

# The library the desktop binary (and, later, a mobile entry point) calls into.
[lib]
name = "pharmastock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
