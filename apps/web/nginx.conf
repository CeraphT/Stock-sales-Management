# SPA config: serve static assets, fall back to index.html for client-side routes
# (the app uses createBrowserRouter, so /dashboard etc. must resolve to index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
