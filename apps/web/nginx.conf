# SPA config: serve static assets, fall back to index.html for client-side routes
# (the app uses createBrowserRouter, so /dashboard etc. must resolve to index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The page itself must never be reused from cache: each deploy replaces the
    # hashed assets, and a stale index.html pointing at deleted files shows a
    # blank page. Revalidate on every load (cheap: 304 when unchanged).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
